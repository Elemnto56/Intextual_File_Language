<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intext Playground</title>
    <link rel="icon" href="../assets/favicon-32x32.png">
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <script type="text/javascript" src="./script.js"></script>
    <!-- Header -->
    <header>
        <h1>ITX Playground</h1>
        <button id="return" onclick="server.return()">Return Back To Docs</button>
        <button class="theme-toggle" title="Toggle Theme">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="5"/>
                <line x1="12" y1="1" x2="12" y2="3"/>
                <line x1="12" y1="21" x2="12" y2="23"/>
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
                <line x1="1" y1="12" x2="3" y2="12"/>
                <line x1="21" y1="12" x2="23" y2="12"/>
                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
            </svg>
        </button>
    </header>

    <!-- Main Layout -->
    <div class="layout">
        <!-- File Explorer Sidebar -->
        <aside class="file-explorer">
            <div class="explorer-header">Files</div>
            <div class="file-tree" id="file-tree">
                <!--Where to append new files. Also, data-ext is an attribute to use for different emojis to be used based on it. Refer to style CSS for more.-->
            </div>
        </aside>

        <!-- Main Content -->
        <main>
            <!-- Run Button -->
            <button class="run-btn" onclick="server.runCode()">Run</button>

            <!-- Editor Container -->
            <div class="editor-container">
                <!-- Input Section -->
                <div class="input-section">
                    <label>Input</label>
                    <textarea id="code-input" placeholder="Enter your code here..."></textarea>
                </div>

                <!-- Output Section -->
                <div class="output-section">
                    <label>Output</label>
                    <textarea id="code-output" placeholder="Output will appear here..." readonly></textarea>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
