<!DOCTYPE HTML>
<html lang="en-us">
    <head>
        <title>Playground Downtime</title>
    </head>
    <style>
        * {
            text-align: center;
            background-color: #121212;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        h1, h5, h6, p, button, input {
            color: #f0f0f0;
        }
    </style>
    <body>
        <h1>The Intext Playground is on Downtime</h1>
        <h5>Making things better behind the scenes...</h5>

        <h6>Play a minigame for fun!</h6>

        <p>Guess a number between 1 and 100:</p>
        <script>
            let secret = Math.floor(Math.random() * 100) + 1;

            function checkGuess() {
                const input = document.getElementById("guess").value;
                const result = document.getElementById("result");

                if (input < secret) {
                result.textContent = "Too low!";
                } else if (input > secret) {
                result.textContent = "Too high!";
                } else {
                result.textContent = "Correct!";
                secret = Math.floor(Math.random() * 100) + 1;
                }
            }
        </script>
    
        <input type="number" id="guess">
        <button onclick="checkGuess()">Submit</button>
        <p id="result"></p>
    </body>
</html>
